<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Properties | EstateHub</title>
    <link rel="stylesheet" href="css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <h2 class="logo">
            <i class="fa-solid fa-house"></i> EstateHub
        </h2>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="buy.html">Buy</a></li>
                <li><a href="rent.html" aria-current="page">Rent</a></li>
                <li><a href="sell.html">Sell</a></li>
                <li><a href="listings.html">My Listings</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-banner">
        <h1>Find a Property for Rent</h1>
        <p>Discover apartments, houses and commercial spaces for rent.</p>
    </section>

    <section class="page-search" aria-label="Search rental properties">
        <input type="text" id="rent-location" placeholder="Enter city or location"
            aria-label="City or location">

        <select id="rent-type" aria-label="Property type">
            <option value="">All Property Types</option>
            <option value="house">House</option>
            <option value="villa">Villa</option>
            <option value="apartment">Apartment</option>
            <option value="penthouse">Penthouse</option>
            <option value="farmhouse">Farmhouse</option>
            <option value="cottage">Cottage</option>
            <option value="bungalow">Bungalow</option>
            <option value="independent-house">Independent House</option>
            <option value="plot">Plot</option>
            <option value="commercial">Commercial</option>
        </select>

        <select id="rent-min-price" aria-label="Minimum monthly rent">
            <option value="">No minimum rent</option>
            <option value="10000">₹10,000 / month</option>
            <option value="20000">₹20,000 / month</option>
            <option value="30000">₹30,000 / month</option>
            <option value="50000">₹50,000 / month</option>
        </select>

        <select id="rent-max-price" aria-label="Maximum monthly rent">
            <option value="">No maximum rent</option>
            <option value="20000">₹20,000 / month</option>
            <option value="30000">₹30,000 / month</option>
            <option value="50000">₹50,000 / month</option>
            <option value="100000">₹1 Lakh / month</option>
        </select>

        <select id="rent-sort" aria-label="Sort rental properties">
            <option value="default">Default order</option>
            <option value="price-low">Rent: Low to High</option>
            <option value="price-high">Rent: High to Low</option>
        </select>

        <button type="button" id="rent-search-btn">
            <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
    </section>

    <section class="buy-properties">
        <h2>Properties for Rent</h2>
        <div id="rent-property-list" class="property-grid">
            <p>Rental properties will appear here.</p>
        </div>
    </section>

    <script src="browse.js"></script>
</body>
</html>
